<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recruiter Agent — AI Labs Prototype</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   PROTOTYPE — Recruiter Agent workspace (AI Labs), fully clickable.
   Demonstrates: req intake → pool rediscovery → BROWSER-USE sourcing
   (new capability, see PRD) → governed talent-pool data store →
   outreach → screening → scheduling → handoff to onboarding demo.
   Design language: ai-labs-mfe tokens.
   ═══════════════════════════════════════════════════════════════════ */
/* ═══ BetterPlace Studio deck design language ═══════════════════
   Single visual world (deck-dark, by design — matches studio deck):
   navy #05081f ground · Poppins display · Inter body ·
   JetBrains Mono labels · yellow #ffc401 accent */
/* ═══ AI Labs PRODUCT design language (in-app surface) ═══ */
:root{
  --primary:#1B2D93; --primary-text:#1B2D93; --accent:#0953E5;
  --primary-light:#e3ecff; --primary-lighter:#f1f4ff;
  --async:#7c3aed; --async-light:#ede9fe;
  --success:#16a34a; --success-light:#dcfce7;
  --warning:#d97706; --warning-light:#fef3c7;
  --danger:#dc2626; --danger-light:#fee2e2;
  --ok:#16a34a; --ok-light:#dcfce7; --warn:#d97706; --warn-light:#fef3c7;
  --err:#dc2626; --err-light:#fee2e2;
  --bg:#f5f6fa; --surface:#ffffff; --muted:#f9fafb; --surface-muted:#f9fafb;
  --border:#e1e4e8; --border-2:#d1d5db; --border-strong:#d1d5db;
  --text:#1a1a2e; --text-2:#6b7280; --text-3:#9ca3af;
  --side:#1a1a2e; --side-text:#e5e7f0;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --disp:var(--sans);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-sm:6px; --r:10px; --r-lg:14px; --r-pill:999px;
  --shadow:0 1px 2px rgba(26,26,46,.05),0 6px 20px -8px rgba(26,26,46,.12);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── top bar ── */
.top{background:var(--side);color:#e5e7f0;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:#fff}
.top .brand .lg{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#6d28d9,#8b5cf6);display:grid;place-items:center;font-size:12px}
.top .crumb{font-family:var(--mono);font-size:11px;opacity:.65}
.top .links{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.top .links a{color:#cdd3ea;font-size:11px;text-decoration:none;border:1px solid rgba(255,255,255,.2);border-radius:var(--r-pill);padding:4px 11px}
.top .org{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:var(--r-pill);padding:4px 11px;font-size:11px}
.top .org i{width:15px;height:15px;border-radius:4px;background:#008C15;display:grid;place-items:center;color:#FFC600;font-weight:800;font-size:8.5px;font-style:normal}

/* ── layout: chat + workspace (mobile-first: stacked) ── */
.wrap{display:flex;flex-direction:column;height:calc(100dvh - 49px)}
.chatpane{display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);min-height:0;flex:1}
.workpane{min-height:0;overflow-y:auto;padding:14px;background:var(--bg);flex:1;border-top:1px solid var(--border)}
@media(min-width:1000px){
  .wrap{flex-direction:row}
  .chatpane{width:400px;flex:none}
  .workpane{flex:1;padding:22px 26px;border-top:none}
}

/* chat */
.chead{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center}
.chead .av{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:grid;place-items:center;font-size:15px}
.chead b{font-size:14px;display:block}
.chead .st{font-size:11px;color:var(--ok);display:flex;align-items:center;gap:5px}
.chead .st::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ok)}
.cbody{flex:1;overflow-y:auto;padding:14px 14px 6px;min-height:0}
.m{display:flex;margin-bottom:9px;animation:pop .25s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{opacity:0;transform:translateY(7px)}to{opacity:1}}
.m.bot{justify-content:flex-start}.m.me{justify-content:flex-end}
.bub{max-width:86%;padding:9px 13px;border-radius:13px;font-size:13.5px;line-height:1.45}
.bot .bub{background:var(--muted);border:1px solid var(--border);border-bottom-left-radius:5px}
.me .bub{background:var(--primary);color:#fff;border-bottom-right-radius:5px}
.typing{display:inline-flex;gap:4px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--text-3);animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.qr{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 12px}
.qr button{border:1.5px solid var(--accent);color:var(--accent);background:var(--surface);border-radius:var(--r-pill);padding:7px 14px;font-size:12.5px;font-weight:600}
.qr button:hover{background:var(--primary-lighter)}
.qr button:disabled{opacity:.4;cursor:default}
.qr button.picked{background:var(--primary);border-color:var(--primary);color:#fff}
.cfoot{border-top:1px solid var(--border);padding:10px 12px;display:flex;gap:8px}
.cfoot input{flex:1;padding:10px 14px;border:1px solid var(--border-2);border-radius:var(--r-pill);font-size:13px;background:var(--muted);color:var(--text)}
.cfoot .send{width:38px;height:38px;border-radius:50%;border:none;background:var(--primary);color:#fff;font-size:15px}
.sysnote{text-align:center;font-family:var(--mono);font-size:10px;color:var(--text-3);margin:10px 0}

/* workspace panels */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px;animation:pop .3s}
.panel h3{margin:0 0 3px;font-size:14.5px;font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel .sub{color:var(--text-2);font-size:12px;margin:0 0 12px}
.chip{display:inline-block;font-size:10px;font-weight:650;border-radius:var(--r-pill);padding:2px 9px}
.chip.ok{background:var(--ok-light);color:var(--ok)}
.chip.warn{background:var(--warn-light);color:var(--warn)}
.chip.err{background:var(--err-light);color:var(--err)}
.chip.b{background:var(--primary-light);color:var(--primary)}
.chip.v{background:var(--async-light);color:var(--async)}
.chip.mut{background:var(--muted);color:var(--text-2);border:1px solid var(--border)}
.cap{display:inline-block;font-family:var(--mono);font-size:9.5px;background:var(--async-light);color:var(--async);border-radius:5px;padding:2px 7px;margin:8px 5px 0 0}
.empty{color:var(--text-3);text-align:center;padding:60px 20px;font-size:13px}
.empty .ic{font-size:34px;margin-bottom:8px}

/* req card */
.req .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:4px}
.req .f{background:var(--muted);border:1px solid var(--border);border-radius:9px;padding:8px 11px}
.req .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3)}
.req .v{font-weight:650;font-size:13px;margin-top:1px}

/* browser session */
.browser{border:1px solid var(--border-2);border-radius:12px;overflow:hidden}
.burl{display:flex;align-items:center;gap:8px;background:var(--muted);border-bottom:1px solid var(--border);padding:8px 12px}
.burl .dots i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}
.burl .dots i:nth-child(1){background:#f87171}.burl .dots i:nth-child(2){background:#fbbf24}.burl .dots i:nth-child(3){background:#4ade80}
.burl .url{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-pill);padding:5px 13px;font-family:var(--mono);font-size:11px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burl .rec{font-family:var(--mono);font-size:9.5px;color:var(--err);display:flex;align-items:center;gap:4px}
.burl .rec::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--err);animation:blink 1.2s infinite}
.bview{min-height:170px;background:var(--muted);padding:12px 14px;position:relative}
.serp{display:grid;gap:7px}
.serp .row{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:12px;animation:pop .3s}
.serp .row b{font-size:12.5px}
.serp .row .meta{color:var(--text-3);font-size:10.5px}
.serp .row .got{font-family:var(--mono);font-size:9.5px;color:var(--ok)}
.blog{background:#0d1117;color:#9fe8b5;font-family:var(--mono);font-size:10.5px;line-height:1.75;padding:11px 14px;max-height:150px;overflow-y:auto}
.blog .t{color:#5b6472;margin-right:8px}
.blog .act{color:#7cc4fa}
.blog .warn{color:#fbbf24}
.bfoot{display:flex;flex-wrap:wrap;gap:6px;padding:9px 12px;background:var(--muted);border-top:1px solid var(--border)}
.gr{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--text-2);border:1px solid var(--border);border-radius:var(--r-pill);padding:3px 9px;background:var(--surface)}
.gr::before{content:"✓";color:var(--ok);font-weight:700}

/* talent pool table */
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:8px 11px;border-top:1px solid var(--border);font-size:12px}
th{border-top:none;background:var(--muted);font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);font-weight:500}
td b{font-size:12.5px}
td .src{font-family:var(--mono);font-size:10px;color:var(--text-3)}
.score{font-family:var(--mono);font-weight:700}
.score.hi{color:var(--ok)}.score.md{color:var(--warn)}
tr.dim td{opacity:.45}

/* outreach */
.wa{background:#e7f6ec;border:1px solid #bfe3cc;border-radius:12px;padding:12px 14px;max-width:430px}
:root[data-theme="dark"] .wa{background:#12301d;border-color:#1e4a2e}
@media (prefers-color-scheme:dark){.wa{background:#12301d;border-color:#1e4a2e}}
.wa .from{font-size:10.5px;color:var(--text-3);font-family:var(--mono);margin-bottom:6px}
.wa .msg{font-size:12.5px;line-height:1.5}
.wa .msg b{color:var(--ok)}
.replies{display:grid;gap:7px;margin-top:10px}
.rep{display:flex;gap:9px;align-items:center;background:var(--muted);border:1px solid var(--border);border-radius:9px;padding:8px 11px;font-size:12px}
.rep .who{font-weight:650;min-width:88px}

/* timeline / funnel */
.funnel{display:grid;gap:6px;margin-top:6px}
.fr{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;font-size:12px}
.fr .bar{height:17px;border-radius:5px;background:linear-gradient(90deg,var(--primary),var(--accent));opacity:.9}
.fr .n{font-family:var(--mono);font-size:11px;text-align:right}
.stat3{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:10px}
.stat3 .s{background:var(--muted);border:1px solid var(--border);border-radius:10px;padding:11px 13px;text-align:center}
.stat3 .n{font-size:21px;font-weight:750;font-variant-numeric:tabular-nums}
.stat3 .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text-3);margin-top:2px}
.handoff{display:flex;gap:10px;align-items:center;background:var(--primary-lighter);border:1px solid var(--primary-light);border-radius:12px;padding:13px 16px;margin-top:12px}
.handoff .btn{margin-left:auto;background:var(--primary);color:#fff;border:none;border-radius:9px;padding:9px 15px;font-size:12.5px;font-weight:650;text-decoration:none;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.slot{border:1.5px solid var(--border-2);border-radius:9px;padding:9px 8px;text-align:center;font-size:11.5px}
.slot b{display:block;font-size:12.5px}
.slot.on{border-color:var(--ok);background:var(--ok-light)}
</style>
</head>
<body>

<div class="top">
  <div class="brand"><span class="lg">⚗️</span> AI Labs</div>
  <span class="crumb">Agents / <b>Recruiter Agent</b> · Talent Ops Workspace</span>
  <div class="links">
    <a href="browseruse-capability-prd.html" title="The PRD behind the browser session panel">📄 Browser-Use PRD</a>
    <a href="subway-crew-onboarding.html" title="Where hired candidates land">🥪 Onboarding demo</a>
    <span class="org"><i>S</i> Subway MY</span>
  </div>
</div>

<div class="wrap">
  <!-- CHAT -->
  <section class="chatpane">
    <div class="chead">
      <div class="av">🎯</div>
      <div><b>Recruiter Agent</b><span class="st">Online · Suria KLCC pod</span></div>
    </div>
    <div class="cbody" id="chat"></div>
    <div class="cfoot">
      <input placeholder="Ask or instruct…" disabled>
      <button class="send">➤</button>
    </div>
  </section>

  <!-- WORKSPACE -->
  <section class="workpane" id="work">
    <div class="empty" id="emptystate"><div class="ic">🗂️</div>The workspace fills as the agent works.<br>Start in the chat.</div>
  </section>
</div>

<script>
/* ── engine ── */
const C = document.getElementById('chat');
const W = document.getElementById('work');
function el(h){const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild}
function cscroll(){C.scrollTop=C.scrollHeight;requestAnimationFrame(()=>{C.scrollTop=C.scrollHeight})}
function wscroll(){W.scrollTop=W.scrollHeight;requestAnimationFrame(()=>{W.scrollTop=W.scrollHeight})}
function typing(cb,delay=850){const t=el(`<div class="m bot"><div class="bub typing"><i></i><i></i><i></i></div></div>`);C.appendChild(t);cscroll();setTimeout(()=>{t.remove();cb();cscroll()},delay)}
function bot(h,cb,d=850){typing(()=>{C.appendChild(el(`<div class="m bot"><div class="bub">${h}</div></div>`));if(cb)cb()},d)}
function me(t){C.appendChild(el(`<div class="m me"><div class="bub">${t}</div></div>`));cscroll()}
function qr(opts){const q=el(`<div class="qr"></div>`);opts.forEach(o=>{const b=document.createElement('button');b.textContent=o.label;b.onclick=()=>{q.querySelectorAll('button').forEach(x=>x.disabled=true);b.classList.add('picked');o.on()};q.appendChild(b)});C.appendChild(q);cscroll();return q}
function panel(h){document.getElementById('emptystate')?.remove();const p=el(`<div class="panel">${h}</div>`);W.appendChild(p);wscroll();return p}

/* ── stage 0: greet ── */
window.addEventListener('load',()=>{
  bot(`Morning Meera 👋 Quick status: <b>2 open reqs</b>, 1 interview loop running at Mid Valley, and your KLCC store flagged weekend understaffing. What are we working on?`,()=>{
    qr([
      {label:'Need 3 Sandwich Artists at Suria KLCC by Monday',on:stage1},
      {label:'Show open reqs',on:()=>{me('Show open reqs');bot(`Both open reqs are in the workspace normally — for this demo, let's start a new one 🙂`,()=>qr([{label:'Need 3 Sandwich Artists at Suria KLCC by Monday',on:stage1}]))}},
    ]);
  },600);
});

/* ── stage 1: req intake ── */
function stage1(){
  me('I need 3 Sandwich Artists at Suria KLCC by Monday');
  bot(`Got it. I drafted the requisition from your message + store defaults — check the workspace 👉`,()=>{
    panel(`
      <h3>Requisition draft <span class="chip b">REQ-2291</span> <span class="chip mut">auto-parsed</span></h3>
      <p class="sub">From your message + Suria KLCC store profile + last quarter's hires</p>
      <div class="req"><div class="g">
        <div class="f"><div class="k">Role</div><div class="v">Sandwich Artist™</div></div>
        <div class="f"><div class="k">Openings</div><div class="v">3</div></div>
        <div class="f"><div class="k">Store</div><div class="v">Suria KLCC</div></div>
        <div class="f"><div class="k">Start by</div><div class="v">Mon 24 Aug</div></div>
        <div class="f"><div class="k">Pay band</div><div class="v">RM 1,700–1,900</div></div>
        <div class="f"><div class="k">Shifts needed</div><div class="v">Evenings + weekends</div></div>
        <div class="f"><div class="k">Must-have</div><div class="v">18+, food handling ok</div></div>
        <div class="f"><div class="k">Nice-to-have</div><div class="v">F&amp;B experience, EN/BM</div></div>
      </div></div>
      <span class="cap">CHAT_AGENT step: req_intake</span><span class="cap">tool: store_profile</span>
    `);
    qr([
      {label:'Approve req ✓',on:stage2},
      {label:'Change pay band',on:()=>{me('Change pay band');bot(`Sure — what range? (demo: keeping RM 1,700–1,900)`,()=>qr([{label:'Keep and approve ✓',on:stage2}]))}},
    ]);
  });
}

/* ── stage 2: sourcing plan + pool rediscovery ── */
function stage2(){
  me('Approve req ✓');
  bot(`Sourcing plan, cheapest first:<br>1️⃣ <b>Rediscover our talent pool</b> — free, instant<br>2️⃣ <b>Browser-source</b> JobStreet + FastJobs — they have no API, so I'll browse them like a person would<br>3️⃣ Referral blast to current KLCC crew<br><br>Running step 1 now…`,()=>{
    panel(`
      <h3>Talent pool rediscovery <span class="chip ok">4 matches</span></h3>
      <p class="sub">Past applicants &amp; silver-medalists within 8 km of KLCC, active ≤ 6 months — searched 1,240 records in 0.4s</p>
      <div class="tblwrap"><table>
        <thead><tr><th>Candidate</th><th>Last touch</th><th>Distance</th><th>Fit signal</th><th>Consent state</th></tr></thead>
        <tbody>
          <tr><td><b>Farhana M.</b><div class="src">applied Mar '26 · runner-up, Pavilion</div></td><td>5 mo</td><td>3.1 km</td><td>Scored 8.2/10 at Pavilion loop</td><td><span class="chip ok">opted-in</span></td></tr>
          <tr><td><b>Kevin Tan</b><div class="src">applied Jun '26 · withdrew (exams)</div></td><td>2 mo</td><td>5.4 km</td><td>F&amp;B 1 yr · exams done July</td><td><span class="chip ok">opted-in</span></td></tr>
          <tr><td><b>Nurul H.</b><div class="src">gig worker, ex-Troopers</div></td><td>3 mo</td><td>2.2 km</td><td>Weekend availability confirmed</td><td><span class="chip ok">opted-in</span></td></tr>
          <tr><td><b>Arjun R.</b><div class="src">applied Jan '26</div></td><td>7 mo</td><td>6.8 km</td><td>Older profile — refresh needed</td><td><span class="chip warn">re-consent due</span></td></tr>
        </tbody>
      </table></div>
      <span class="cap">Datasets: candidate_pool</span><span class="cap">tool: pool_search</span>
    `);
    bot(`4 warm candidates from our own pool — <b>rediscovery beats sourcing</b>, they already know us. But 4 isn't enough cover for 3 seats. I recommend browser-sourcing next.<br><br>⚠️ This needs your approval: <b>JobStreet &amp; FastJobs have no API</b>, so I'll operate a real browser. Scope I'm requesting:`,()=>{
      panel(`
        <h3>Browser session request <span class="chip warn">needs approval</span></h3>
        <p class="sub">Human-in-the-loop gate — the agent states exactly what it will and won't do before any browsing starts</p>
        <div class="req"><div class="g">
          <div class="f"><div class="k">Sites</div><div class="v">jobstreet.com.my, fastjobs.my</div></div>
          <div class="f"><div class="k">Actions</div><div class="v">search, read, extract</div></div>
          <div class="f"><div class="k">Never</div><div class="v">log in, apply, message, pay</div></div>
          <div class="f"><div class="k">Data collected</div><div class="v">public profile fields only</div></div>
          <div class="f"><div class="k">Budget</div><div class="v">≤ 20 min · ~4.2 credits</div></div>
          <div class="f"><div class="k">Audit</div><div class="v">full session recording</div></div>
        </div></div>
        <span class="cap">BROWSER step (new — see PRD)</span><span class="cap">guardrail: domain allowlist</span><span class="cap">guardrail: no credentials</span>
      `);
      qr([
        {label:'Approve browser session ✓',on:stage3},
        {label:"Why can't we use an API?",on:()=>{me("Why can't we use an API?");bot(`Job boards don't expose candidate search APIs to employers like us — the data is only reachable through their website UI. Browser use is the universal connector when there's no API. Everything I do is logged, recorded, and scoped to what you approve.`,()=>qr([{label:'Approve browser session ✓',on:stage3}]))}},
      ]);
    },1100);
  });
}

/* ── stage 3: browser session ── */
function stage3(){
  me('Approve browser session ✓');
  bot(`Session started 🌐 — watch the workspace. You can pause or kill it anytime; every action is in the log.`,()=>{
    const p = panel(`
      <h3>Browser session <span class="chip v">BROWSER step</span> <span class="chip err">● recording</span> <span class="chip mut" id="bcount">0 profiles</span></h3>
      <p class="sub">Live view + action log · session artifacts stored to the run for audit</p>
      <div class="browser">

}

function runBrowser(){
  const blog=document.getElementById('blog'),serp=document.getElementById('serp'),cnt=document.getElementById('bcount'),url=document.getElementById('burl');
  let i=0,got=0;
  const iv=setInterval(()=>{
    if(i>=LOG.length){clearInterval(iv);return browserDone()}
    const [act,detail]=LOG[i];
    const t=new Date(Date.now()).toTimeString().slice(0,8);
    blog.insertAdjacentHTML('beforeend',`<div><span class="t">${t}</span><span class="${act==='wait'?'warn':'act'}">${act}</span> ${detail}</div>`);
    blog.scrollTop=blog.scrollHeight;
    if(act==='extract'){got+= detail.startsWith('+4')?4:1;cnt.textContent=got+' profiles';
      const r=SERPROWS[Math.min(got-1,SERPROWS.length-1)];
      if(got<=SERPROWS.length)serp.insertAdjacentHTML('beforeend',`<div class="row"><div><b>${r[0]}</b><div class="meta">${r[1]}</div></div><span class="got">extracted ✓</span></div>`);
    }
    if(act==='navigate')url.textContent='https://'+detail;
    i++;wscroll();
  },700);
}
